<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Strategy</title><link rel=stylesheet href=style.css></head><body><script src=common.js></script><script>if(gate())layout('strategy',`<section class=hero><span class=eyebrow>STRATEGIC COMMAND</span><h1>Think in systems, incentives and consequences.</h1><p>Advanced practice in leadership, negotiation, planning, teaching and resilience.</p></section><div class=grid>${[['Leadership','Direction, accountability, incentives and feedback.'],['Negotiation','Positions vs interests, BATNA and trade-offs.'],['Strategic Planning','Objectives, constraints, assumptions, risks, milestones and fallback plans.'],['Teaching & Mentorship','Explain difficult ideas at beginner, technical and practical levels.'],['Resilience & Adaptability','Learn from failure and revise strategy.'],['Game Theory','Model cooperation, competition and repeated interaction.']].map(x=>`<div class=card><h2>${x[0]}</h2><p class=muted>${x[1]}</p><textarea placeholder='Work through a realistic scenario...'></textarea></div>`).join('')}</div>`)</script></body></html>
