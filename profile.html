<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Profile</title><link rel=stylesheet href=style.css></head><body><script src=common.js></script><script>if(gate()){async function refresh(){let b=await readBin(),u=b.users[S.key];if(!u)return alert('Cloud account not found');S={key:S.key,name:u.name,...u.profile};save();location.reload()}function logout(){sessionStorage.removeItem(SESSION);location.href='index.html'}layout('profile',`<section class=hero><span class=eyebrow>AVATAR PROFILE</span><h1>${esc(S.name)}</h1><p>Level <b>${level()}</b> • Day ${S.day}/365 • Mastery ${mastery()}%</p><button class=btn onclick=refresh()>Refresh from Cloud</button> <button class=btn onclick=logout()>Sign Out</button></section><div class=grid><div class=card><div class=metric>${mastery()}%</div><p class=muted>Mastery</p></div><div class=card><div class=metric>${Object.keys(S.progress||{}).length}</div><p class=muted>Days Passed</p></div><div class=card><div class=metric>${(S.beliefs||[]).length}</div><p class=muted>Belief Updates</p></div><div class=card><div class=metric>${(S.forecasts||[]).length}</div><p class=muted>Forecasts</p></div></div>`)}</script></body></html>
