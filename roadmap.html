<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Roadmap</title><link rel=stylesheet href=style.css></head><body><script src=data.js></script><script src=common.js></script><script>if(gate())layout('roadmap',`<section class=hero><span class=eyebrow>365-DAY ROADMAP</span><h1>Foundations → Mastery.</h1><p>Progressively harder stages integrate disciplines and real-world judgment.</p><div class=bar><div class=fill style=width:${mastery()}%></div></div></section><div class=roadmap>${LESSONS.map(d=>`<div class="day ${S.progress&&S.progress[d.day]?'done':''} ${S.day===d.day?'current':''} ${d.day>S.day?'lock':''}"><b>DAY ${d.day}</b><br><small class=muted>${esc(d.domain)}</small><br><span class=pill>${esc(d.stage)}</span></div>`).join('')}</div>`)</script></body></html>
