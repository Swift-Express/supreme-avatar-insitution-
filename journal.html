<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Wisdom Journal</title><link rel=stylesheet href=style.css></head><body><script src=common.js></script><script>if(gate()){async function add(){let t=entry.value.trim();if(!t)return;S.journal=S.journal||[];S.journal.push({day:S.day,text:t,date:new Date().toISOString()});let b=await readBin();b.users[S.key].profile={...b.users[S.key].profile,day:S.day,progress:S.progress,attempts:S.attempts,journal:S.journal,beliefs:S.beliefs||[],forecasts:S.forecasts||[]};await writeBin(b);save();location.reload()}layout('journal',`<section class=hero><span class=eyebrow>WISDOM JOURNAL</span><h1>Learn. Reflect. Update.</h1><p>Record mistakes, evidence, insights and decisions. Intellectual humility is part of mastery.</p></section><div class=card><textarea id=entry placeholder='What did I learn? Where was I wrong? What evidence changed my thinking?'></textarea><button class='btn gold' onclick=add()>Save to Cloud</button></div><div class=grid>${(S.journal||[]).slice().reverse().map(x=>`<div class=card><span class=pill>Day ${x.day}</span><p>${esc(x.text)}</p></div>`).join('')||'<div class=card><p class=muted>No reflections yet.</p></div>'}</div>`)}</script></body></html>
