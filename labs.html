<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Reality Labs</title><link rel=stylesheet href=style.css></head><body><script src=common.js></script><script>if(gate()){async function sync(){let b=await readBin();b.users[S.key].profile={...b.users[S.key].profile,...S};delete b.users[S.key].profile.key;await writeBin(b);alert('Labs synchronized to JSONBin.')}function belief(){S.beliefs=S.beliefs||[];S.beliefs.push({claim:claim.value,evidence:evidence.value,confidence:+confidence.value,date:new Date().toISOString()});save();alert('Saved to session. Click Sync to upload.')}function forecast(){S.forecasts=S.forecasts||[];S.forecasts.push({question:fq.value,probability:+probability.value,resolution:resolution.value});save();alert('Forecast saved.')}layout('labs',`<section class=hero><span class=eyebrow>REALITY LAB</span><h1>Train against being wrong.</h1><p>Investigate claims, quantify uncertainty, make forecasts, test causal models and improve information hygiene.</p><button class='btn gold' onclick=sync()>Sync to Cloud</button></section><div class=grid><div class=card><h2>Reality Lab</h2><textarea id=claim placeholder=Claim></textarea><textarea id=evidence placeholder='Evidence for/against + assumptions'></textarea><input id=confidence type=number min=0 max=100 placeholder='Confidence %'><button class='btn gold' onclick=belief()>Save Belief</button></div><div class=card><h2>Forecasting Lab</h2><textarea id=fq placeholder='Forecast question'></textarea><input id=probability type=number min=0 max=100 placeholder='Probability %'><input id=resolution placeholder='Resolution date'><button class=btn onclick=forecast()>Save Forecast</button></div><div class=card><h2>Causal Reasoning</h2><p class=muted>Mechanism • confounders • alternatives • interventions • falsification.</p><textarea placeholder='Build a causal model...'></textarea></div><div class=card><h2>Statistics & Data</h2><p class=muted>Base rates • sampling • uncertainty • effect size • misleading charts.</p><textarea placeholder='Analyze a statistic...'></textarea></div><div class=card><h2>Digital Safety</h2><p class=muted>Phishing • privacy • source verification • deepfake awareness • safe AI.</p><textarea placeholder='Verify a suspicious claim...'></textarea></div></div>`)}</script></body></html>
