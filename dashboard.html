<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Dashboard</title><link rel=stylesheet href=style.css></head><body><script src=data.js></script><script src=common.js></script><script>if(gate()){let d=LESSONS[S.day-1];layout('dashboard',`<section class=hero><span class=eyebrow>COMMAND CENTER</span><h1>Welcome, ${esc(S.name)}.</h1><p>Mastery is measured across many trainable competencies—not by a fictional IQ or brain-use percentage.</p><div class=actions><a class='btn gold' href=study.html>Continue Day ${S.day}</a><a class=btn href=roadmap.html>365-Day Roadmap</a></div></section><div class=grid><div class=card><span class=muted>Current Day</span><div class=metric>${S.day}/365</div></div><div class=card><span class=muted>Mastery</span><div class=metric>${mastery()}%</div><div class=bar><div class=fill style=width:${mastery()}%></div></div></div><div class=card><span class=muted>Level</span><div class=metric style=font-size:24px>${level()}</div></div><div class=card><span class=muted>Completed</span><div class=metric>${Object.keys(S.progress||{}).length}</div></div></div><div class=card><span class=pill>${esc(d.stage)}</span><span class=pill>${esc(d.domain)}</span><h2>${esc(d.title)}</h2><p class=muted>${esc(d.concept)}</p></div><div class=grid>${['Logic & mathematics','Probability, statistics & causality','Science & information literacy','AI & digital safety','Economics, finance & strategy','Psychology & social intelligence','Philosophy & ethics','Communication, history & civics','Health, engineering & design','Leadership & negotiation','Creativity & culture','Resilience, planning & long-term judgment'].map(x=>`<div class=card><h3>${x}</h3><p class=muted>Progressive study, practice, examination and reflection.</p></div>`).join('')}</div>`)}</script></body></html>
