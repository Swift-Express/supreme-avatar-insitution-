<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Study</title><link rel=stylesheet href=style.css></head><body><script src=data.js></script><script src=common.js></script><script>if(gate()){let d=LESSONS[S.day-1],qs=[...SA_Q].sort(()=>Math.random()-.5).slice(0,10);async function submitExam(e){e.preventDefault();let score=0;qs.forEach((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&a.value===q[2])score++});let pct=score*10;S.attempts=S.attempts||{};S.attempts[S.day]=(S.attempts[S.day]||0)+1;if(pct>=90){S.progress=S.progress||{};S.progress[S.day]={score:pct,date:new Date().toISOString()};if(S.day<365)S.day++}try{let b=await readBin();b.users[S.key].profile={day:S.day,progress:S.progress,attempts:S.attempts,journal:S.journal||[],beliefs:S.beliefs||[],forecasts:S.forecasts||[]};await writeBin(b);save();alert(pct>=90?`Passed ${pct}%. Next day unlocked.`:`Score ${pct}%. You need 90%. Retry.`);location.reload()}catch(x){save();alert('Cloud sync failed: '+x.message);location.reload()}}layout('study',`<section class=hero><span class=eyebrow>DAILY MASTERY</span><span class=pill>DAY ${d.day} • ${esc(d.stage)}</span><h1>${esc(d.title)}</h1><p>${esc(d.concept)}</p><div class=notice>${esc(d.practice)}</div><div class=notice>${esc(d.mission)}</div></section><div class=card><h2>Daily Examination</h2><p class=muted>10 questions • 90% required to unlock the next day.</p><form onsubmit=submitExam(event)>${qs.map((q,i)=>`<div class=q><b>${i+1}. ${esc(q[1])}</b>${[q[2],'Not enough information','Depends on context','None of these'].map(o=>`<label class=option><input required type=radio name=q${i} value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button class='btn gold'>Submit Examination</button></form></div>`)}</script></body></html>
